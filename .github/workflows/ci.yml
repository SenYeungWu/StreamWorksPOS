name: Stream Works Multi-Platform CI/CD Pipeline

on:
  push:
    branches: [ master, main ]
  pull_request:
    branches: [ master, main ]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ---------------------------------------------------------------------------
  # 1. Quality Gates: Formatting, Static Analysis & Automated Tests
  # ---------------------------------------------------------------------------
  quality_and_tests:
    name: Code Analysis & Test Coverage (TASK-5.4 & 5.5)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Flutter SDK
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.27.x'
          channel: 'stable'
          cache: true

      - name: Verify Flutter Environment
        run: flutter doctor -v

      - name: Install Dependencies
        run: flutter pub get

      - name: Run Static Code Analysis
        run: flutter analyze --no-fatal-infos

      - name: Run Automated Test Suite with Coverage
        run: flutter test --coverage

      - name: Upload Test Coverage
        uses: actions/upload-artifact@v4
        with:
          name: lcov-coverage-report
          path: coverage/lcov.info
          if-no-files-found: ignore

  # ---------------------------------------------------------------------------
  # 2. Web Build: Progressive Web App (PWA) Deployment
  # ---------------------------------------------------------------------------
  build_web:
    name: Build Web PWA (Wasm / CanvasKit)
    needs: quality_and_tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Flutter SDK
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.27.x'
          channel: 'stable'
          cache: true

      - name: Install Dependencies
        run: flutter pub get

      - name: Compile Release Web Bundle
        run: flutter build web --release --base-href "/"

      - name: Upload Web Artifact
        uses: actions/upload-artifact@v4
        with:
          name: web-release-bundle
          path: build/web/

  # ---------------------------------------------------------------------------
  # 3. Android Build: APK & AAB (Google Play Bundle)
  # ---------------------------------------------------------------------------
  build_android:
    name: Build Android APK & App Bundle (AAB)
    needs: quality_and_tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Flutter SDK
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.27.x'
          channel: 'stable'
          cache: true

      - name: Install Dependencies
        run: flutter pub get

      - name: Build Android Release APK
        run: flutter build apk --release

      - name: Build Android App Bundle (AAB)
        run: flutter build appbundle --release

      - name: Upload Android Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: android-release-artifacts
          path: |
            build/app/outputs/flutter-apk/app-release.apk
            build/app/outputs/bundle/release/app-release.aab
          if-no-files-found: ignore
